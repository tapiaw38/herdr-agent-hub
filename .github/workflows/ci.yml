name: CI
on:
  push:
  pull_request:
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go fmt ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/agent-hub
